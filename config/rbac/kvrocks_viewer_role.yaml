# This rule is not used by the project kvrocks-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to kvrocks-operator.org resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  labels:
    app.kubernetes.io/name: kvrocks-operator
    app.kubernetes.io/managed-by: kustomize
  name: kvrocks-viewer-role
rules:
- apiGroups:
  - kvrocks-operator.org
  resources:
  - kvrocks
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - kvrocks-operator.org
  resources:
  - kvrocks/status
  verbs:
  - get
